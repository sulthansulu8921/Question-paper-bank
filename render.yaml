services:
  # ─── Django Backend ───────────────────────────────────────────────
  - type: web
    name: qbank-pro-backend
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "qbank-pro-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://qbank-pro.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: qbank-pro-db
          property: connectionString

  # ─── React Frontend ───────────────────────────────────────────────
  - type: web
    name: qbank-pro
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://qbank-pro-backend.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ─── PostgreSQL Database ──────────────────────────────────────────
databases:
  - name: qbank-pro-db
    plan: free
