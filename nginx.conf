server {
    listen 80;
    server_name api.qubook.in; # Change this to your domain

    # Max upload size (for PDF uploads)
    client_max_body_size 50M;

    # Reverse proxy to the Docker container running Django
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static assets directly if wanted
    location /static/ {
        alias /var/www/qubook/static/;
    }

    # Serve media assets directly if wanted
    location /media/ {
        alias /var/www/qubook/media/;
    }
}
